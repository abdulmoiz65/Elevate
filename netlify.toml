# Netlify configuration.
#
# The SPA fallback lives in public/_redirects, not here, so it keeps working on
# hosts that read that file and ignore this one. This file adds the caching
# rules, which Netlify does not apply by default: without them every asset is
# served `max-age=0, must-revalidate` and a returning visitor re-downloads the
# photographs on every page load.

[build]
  command = "npm run build"
  publish = "dist"

# Vite fingerprints its own output, so the filename changes whenever the bytes
# do and the response can be cached forever.
[[headers]]
  for = "/assets/index-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photographs and the WebP derivatives built from them. These are *not*
# fingerprinted — replacing a photograph keeps its filename — so a year of
# immutable caching would strand viewers on the old file. A week with
# revalidation gives repeat visits a free ride without that risk.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/derived/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# index.html must never be cached: it carries the <script> tag pointing at the
# current fingerprinted bundle, and a stale copy points at a deleted one.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
